    title: "NetAlertX"
    url: !secret "hass_addon_netdata_docker_slug"
  it_tools:
    parent: "tabs_development"
    title: "IT-Tools"
    url: !secret "hass_addon_it_tools_webui_local_url"
    headers:
      X-Script-Name: $http_x_ingress_path
      Origin: $auto
    rewrite:
      # fix no directory REST links
      - mode: "body"
        match: href="/*([\S]+)"
        replace: href="$http_x_ingress_path/\1"
      - mode: "body"
        match: src="/*([\S]+)"
        replace: src="$http_x_ingress_path/\1"
      # rewrite root files
      - mode: "body"
        match: \/sw.js
        replace: $http_x_ingress_path/sw.js
      # MIME type correction (if needed for CSS/JS responses)
      - mode: "header"
        path: \.css$
        name: "Content-Type"
        match: "text/plain"
        replace: "text/css"
  cyberchef:
    parent: "tabs_development"
    work_mode: "hassio"
