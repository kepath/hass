  moodist:
    parent: "tabs_media"
    title: "Moodist"
    url: !secret "hass_addon_monica_webui_local_url"
    rewrite:
      # rewrite folders
      - mode: "body"
        match: /(_astro|fonts|sounds)/
        replace: $http_x_ingress_path/\1/
      # rewrite logo
      - mode: "body"
        match: \/logo.svg
        replace: $http_x_ingress_path/logo.svg
      # rewrite root files
      - mode: "body"
        match: \/sw.js
        replace: $http_x_ingress_path/sw.js
      - mode: "body"
        match: \/logo-light.png
        replace: $http_x_ingress_path/logo-light.png
      # MIME type correction (if needed for CSS/JS responses)
      - mode: "header"
        path: \.css$
        name: "Content-Type"
        match: "text/plain"
        replace: "text/css"
