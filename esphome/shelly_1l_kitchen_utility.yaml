  # - platform: "template"
  #   type: "binary"
  #   id: "ha_script"
  #   write_action:
  #     then:
  #       - light.toggle: "light.backdoor_smartbulb"
  #       # - homeassistant.service:
  #       #     service: "script.unique_back_light_toggle"

binary_sensor:
  - platform: "status"
    name: "${friendly_name} Status"
    id: "${device_name}_status"
    icon: "mdi:web-check"
    device_class: "connectivity"
    filters:
      - delayed_off: "5min"

  - platform: "gpio"
    name: "${friendly_name} Switch"
    id: "${device_name}_switchid1"
    icon: "mdi:light-switch"
    pin:
      number: "GPIO4"
    on_state:
      then:
        - light.toggle: "${device_name}_lightid1"
    filters:
      - delayed_on_off: "50ms"
    device_class: "power"

  - platform: "gpio"
    name: "${friendly_name2} Switch"
    id: "${device_name}_switchid2"
    icon: "mdi:light-switch"
    pin:
      number: "GPIO14"
    on_state:
      then:
        - homeassistant.action:
            # action: light.toggle
            # target:
            #   entity_id: "${light2_entityid}"

            action: "${light2_script}"
        # - light.toggle: "${light2_entityid}"
        # - light.toggle: "${device_name}_lightid2"
    device_class: "power"
