---
substitutions:
  device_name: "shellykitchenutility"
  friendly_name: "Kitchen Utility Light"
  friendly_name2: "Back Door Light"
  area: "kitchen"
  light1_icon: "mdi:vanity-light"
  # light2_icon: "mdi:coach-lamp"
  # light2_entityid: "light.backdoor_smartbulb"
  light2_script: "script.unique_back_light_toggle"
  device_ip: "13"
  ssid: !secret "not_wifi_ssid"
  log_level: "DEBUG"
  max_temp: "80.0" # Centigrade

# Common Include
<<: !include "includes/shelly_1l_common.yaml"

# Extended Config - only use when overwriting values in include
